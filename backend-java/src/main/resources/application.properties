server.port=${PORT:8080}
spring.application.name=lecturer-review-service

# SQLite database (shared with the Python backend by default)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:../database/app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Allow the static frontend to call this microservice
app.cors.allowed-origins=${CORS_ORIGINS:*}
